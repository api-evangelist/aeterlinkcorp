aid: aeterlinkcorp
name: Aeterlink Corp.
description: >-
  Aeterlink Corp. is a Tokyo-headquartered deep-tech company, originating from Stanford
  University research, that develops, manufactures and sells spatial (microwave) wireless
  power transfer systems under the AirPlug brand. AirPlug delivers power to battery-free
  IoT sensors and devices at distances of roughly 15-20 meters with bidirectional data
  communication, and is sold into factory automation, building management and medical
  implant applications. Founded in August 2020, the company operates offices in Tokyo,
  Indianapolis and Bangkok, and is active in the international standardization of spatial
  wireless power transfer. Aeterlink publishes no public developer program, API reference
  or machine-readable API contract; its product materials are distributed by request form.
